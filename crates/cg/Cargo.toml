[package]
name = "cg"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cg"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tui-tree-widget = "0.22"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
