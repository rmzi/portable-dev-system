name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secret-scrub hook tests
        run: bash scripts/test-hooks.sh
      - name: orchestrator-pr-gate tests
        run: bash hooks/tests/test-orchestrator-pr-gate.sh
      - name: orchestrator-teardown-gate tests
        run: bash hooks/tests/test-orchestrator-teardown-gate.sh
      - name: worktree hook tests
        run: bash hooks/tests/test-worktree-hooks.sh
      - name: roster-check hook tests
        run: bash hooks/tests/test-roster-check.sh

  dispatch-contract:
    # Static guards for the two bugs that have each, on their own, made every
    # swarm undispatchable while the rest of the suite stayed green:
    #   #181 — orchestrator Task(...) allowlist used bare, un-namespaced names
    #   #170/#182 — WorktreeCreate hook returned no worktree path
    # These run offline. The live end-to-end proof is scripts/smoke-dispatch.sh,
    # which needs an authenticated `claude` and therefore cannot run here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: orchestrator spawn roster is pds:-namespaced and complete
        run: python3 scripts/check-agent-roster.py .
      - name: WorktreeCreate hook returns a path
        run: bash hooks/tests/test-worktree-hooks.sh
      - name: SubagentStart roster check handles pds: namespace
        run: bash hooks/tests/test-roster-check.sh
      - name: install.sh static suite
        run: bash install.sh --test

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo build
        run: cargo build --verbose
      - name: cargo test
        run: cargo test --verbose

  plugin-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate plugin.json / marketplace.json parse
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
      - name: VERSION matches plugin.json/marketplace.json
        run: |
          VERSION=$(cat VERSION)
          PLUGIN_VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          MARKETPLACE_VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          if [ "$VERSION" != "$PLUGIN_VERSION" ] || [ "$VERSION" != "$MARKETPLACE_VERSION" ]; then
            echo "Version mismatch: VERSION=$VERSION plugin.json=$PLUGIN_VERSION marketplace.json=$MARKETPLACE_VERSION"
            exit 1
          fi
